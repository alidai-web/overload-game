/* =========================================================

const $=id=>document.getElementById(id);

/* =========================================================
   TRANSLATION
========================================================= */

function t(key){

    return LANG[lang][key] ||
           LANG.en[key] ||
           key;
}


/* =========================================================
   APPLY LANGUAGE
========================================================= */

function applyLanguage(){

    $("langBtn").textContent=
        "🌐 "+t("code");

    $("levelLabel").textContent=
        t("level");

    $("startBtn").textContent=
        t("start");

    $("actionBtn").textContent=
        t("again");

    $("statLevels").textContent=
        t("levels");

    $("statLives").textContent=
        t("lives");

    $("statMode").textContent=
        t("hard");

    $("tipText").textContent=
        t("survive");

    odd.textContent=t("odd");
    even.textContent=t("even");

    red.textContent=t("red");
    green.textContent=t("green");
}


/* =========================================================
   LANGUAGE MENU
========================================================= */

$("langBtn").onclick=e=>{

    e.stopPropagation();

    $("langMenu").classList.toggle("show");

};

document.querySelectorAll(".langOption")
.forEach(btn=>{

    btn.onclick=e=>{

        e.stopPropagation();

        lang=btn.dataset.lang;

        localStorage.setItem(
            "overloadLang",
            lang
        );

        $("langMenu").classList.remove("show");

        applyLanguage();

    };

});


document.addEventListener("click",()=>{

    $("langMenu").classList.remove("show");

});


/* =========================================================
   SOUND
========================================================= */

function sound(
    freq=500,
    time=.06,
    type="sine"
){

    try{

        if(!audio){

            audio=new(
                window.AudioContext ||
                window.webkitAudioContext
            )();

        }

        if(audio.state==="suspended")
            audio.resume();

        const osc=audio.createOscillator();

        const gain=audio.createGain();

        osc.type=type;

        osc.frequency.value=freq;

        gain.gain.setValueAtTime(
            .055,
            audio.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            audio.currentTime+time
        );

        osc.connect(gain);

        gain.connect(audio.destination);

        osc.start();

        osc.stop(
            audio.currentTime+time
        );

    }catch(e){}

}


function vibrate(pattern){

    try{

        if(navigator.vibrate)
            navigator.vibrate(pattern);

    }catch(e){}

}

========================================================= */

function update(){

    $("level").textContent=level;

    $("coins").textContent=coins;

    let hearts="";

    for(let i=0;i<3;i++){

        hearts+=
            i<lives
            ?"❤️"
            :"🖤";

    }

    $("lives").textContent=hearts;
}


function clearTimers(){

    clearInterval(timerID);
    clearTimeout(delayID);
    clearInterval(moveID);

    timerID=null;
    delayID=null;
    moveID=null;
}


function hideControls(){

    main.style.display="none";

    odd.style.display="none";
    even.style.display="none";

    red.style.display="none";
    green.style.display="none";

    targetColor.style.display="none";

    main.style.left="50%";
    main.style.top="50%";
}


function timer(seconds,onTimeout){

    clearInterval(timerID);

    const start=performance.now();

    const duration=seconds*1000;

    $("timer").style.width="100%";

    timerID=setInterval(()=>{

        const percent=Math.max(
            0,
            100-
            (
                (performance.now()-start)/
                duration
            )*100
        );

        $("timer").style.width=
            percent+"%";

        if(percent<=0){

            clearInterval(timerID);

            timerID=null;

            if(onTimeout)
                onTimeout();

        }

    },20);

}


function good(){

    const f=$("flash");

    f.className="";

    void f.offsetWidth;

    f.className="goodFlash";
}


function bad(){

    const f=$("flash");

    f.className="";

    void f.offsetWidth;

    f.className="badFlash";
}


function comboUp(){

    combo++;

    if(combo>=2){

        const el=$("combo");

        el.textContent=
            t("combo")+" ×"+combo;

        el.className="";

        void el.offsetWidth;

        el.className="comboAnim";

    }

}


function comboReset(){

    combo=0;
}

    main.style.left=
        (16+Math.random()*68)+"%";

    main.style.top=
        (18+Math.random()*64)+"%";
}


/* =========================================================
   SUCCESS
========================================================= */

function success(){

    if(locked)
        return;

    locked=true;

    clearTimers();

    canPressNow=false;

    comboUp();

    const reward=
        10+
        Math.min(combo*3,30);

    score+=reward;

    coins+=reward;

    if(score>best)
        best=score;

    localStorage.setItem(
        "overloadCoins",
        coins
    );

    localStorage.setItem(
        "overloadBest",
        best
    );

    good();

    vibrate(18);

    sound(700,.06);

    $("status").textContent=
        "+"+reward+" 🪙";

    update();

    setTimeout(()=>{

        if(level>=30){

            finish();

            return;

        }

        level++;

        locked=false;

        load();

    },400);

}


/* =========================================================
   FAIL
========================================================= */

function fail(message){

    if(locked)
        return;

    locked=true;

    clearTimers();

    canPressNow=false;

    comboReset();

    lives--;

    bad();

    vibrate([70,30,70]);

    sound(120,.16,"sawtooth");

    $("status").textContent=message;

    update();

    if(lives<=0){

        setTimeout(
            gameOver,
            400
        );

    }else{

        setTimeout(()=>{

            locked=false;

            load();

        },450);

    }

}

/* =========================================================
   MAIN BUTTON
========================================================= */

main.addEventListener(
"pointerdown",
e=>{

    e.preventDefault();

    if(!playing || locked)
        return;

    switch(taskType){

        case "PRESS":

            success();

            break;


        case "THREE_CLICKS":

            clicks++;

            main.textContent=
                clicks+" / 3";

            if(clicks===3){

                success();

            }else if(clicks>3){

                fail(t("tooMany"));

            }

            break;


        case "WAIT":

            /*
               THE CRITICAL FIX:

               The button only works after
               canPressNow becomes TRUE.
            */

            if(canPressNow){

                success();

            }else{

                fail(t("early"));

            }

            break;


        case "MEMORY":

            clicks++;

            main.textContent=clicks;

            if(clicks===target){

                success();

            }else if(clicks>target){

                fail(t("tooMany"));

            }

            break;


        case "MOVING":

            success();

            break;


        case "DONT":

            fail(t("wrong"));

            break;


        case "QUICK_MEMORY":

            clicks++;

            main.textContent=clicks;

            if(clicks===target){

                success();

            }else if(clicks>target){

                fail(t("tooMany"));

            }

            break;


        case "FINAL":

            clicks++;

            main.textContent=
                clicks+" / "+target;

            if(clicks===target){

                success();

            }else if(clicks>target){

                fail(t("tooMany"));

            }

            break;

    }

});

========================================================= */

$("startBtn").onclick=()=>{

       from the game screen.

    $("langMenu").classList.remove("show");

/* =========================================================
   GAME OVER
========================================================= */

function gameOver(){

    clearTimers();

    canPressNow=false;

    $("resultTitle").textContent=
        t("gameOver");

    $("resultText").innerHTML=
        t("lost")+
        "<br><br>"+
        t("score")+
        ": <b>"+
        score+
        "</b><br>"+
        t("best")+
        ": <b>"+
        best+
        "</b><br>"+
        t("coins")+
        ": <b>"+
        coins+
        "</b>";

    $("progress").textContent=
        t("level")+" "+level+"/30";

    $("overlay").classList.add("show");

}


/* =========================================================
   COMPLETE
========================================================= */

function finish(){

    clearTimers();

    canPressNow=false;

    $("resultTitle").textContent=
        t("master");

    $("resultText").innerHTML=
        t("complete")+
        "<br><br>"+
        t("score")+
        ": <b>"+
        score+
        "</b><br>"+
        t("best")+
        ": <b>"+
        best+
        "</b><br>"+
        t("coins")+
        ": <b>"+
        coins+
        "</b>";

    $("progress").textContent=
        "OVERLOAD V18.8";

    $("overlay").classList.add("show");

}
